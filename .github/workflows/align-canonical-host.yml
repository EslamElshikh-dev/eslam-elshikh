name: Align canonical host

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/align-canonical-host.yml"

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Align canonical host and rebuild
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for name in ["src/content.mjs", "scripts/validate.mjs"]:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace("https://eslam-elshikh.com", "https://www.eslam-elshikh.com")
              path.write_text(text, encoding="utf-8")
          PY
          npm run check
          rm -rf dist
          npm run build

      - name: Commit canonical alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No canonical changes to commit."
            exit 0
          fi
          git commit -m "fix: align canonical URLs with primary www domain"
          git push origin HEAD:main
