name: Apply responsive redesign package

on:
  push:
    branches:
      - agent/full-responsive-redesign
    paths:
      - ".site-package/**"
      - ".github/workflows/apply-responsive-redesign.yml"

permissions:
  contents: write

jobs:
  apply-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore source files
        shell: bash
        run: |
          set -euo pipefail
          cat .site-package/part-* | base64 --decode > /tmp/eslam-site-source.tgz
          tar -xzf /tmp/eslam-site-source.tgz -C .
          rm -rf .site-package

      - name: Validate source and generated site
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          rm -rf dist
          npm run build

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: launch full responsive Arabic-first redesign"
          git push origin HEAD:${GITHUB_REF_NAME}
