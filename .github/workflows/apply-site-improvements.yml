name: Apply staged website improvements

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-site-improvements.yml

permissions:
  contents: write

jobs:
  improve-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Phase 1 - credentials, case studies and conversion tracking
        shell: bash
        run: |
          cat > /tmp/phase1.py <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index = root / 'index.html'
          projects = root / 'projects/index.html'
          css_path = root / 'assets/css/main.css'
          js_path = root / 'assets/js/main.js'

          credentials = '''
      <section class="section-pad credentials-section" id="credentials">
        <div class="container">
          <div class="section-head reveal"><span class="eyebrow"><span></span>الاعتمادات والخبرة</span><h2>هوية مهنية يمكن التحقق منها</h2><p>مسارات تقنية ومساهمات موثقة تربط الأمن السيبراني والبرمجيات وخبرة منتجات Google بالتنفيذ العملي.</p></div>
          <div class="credentials-grid">
            <article class="credential-card reveal"><span class="credential-kicker">Google</span><h3>خبير منتجات Google</h3><p>خبرة عملية في دعم منتجات Google وتشخيص مشكلات ملفات الأنشطة التجارية وتوجيه المستخدمين إلى المسارات الرسمية.</p><a class="text-link" href="https://me.developers.google.com/u/EslamElshikh" target="_blank" rel="noopener">عرض الملف الرسمي</a></article>
            <article class="credential-card reveal"><span class="credential-kicker">Google Developers</span><h3>Google Developer Expert</h3><p>خبرة تقنية تجمع التطوير، الحلول السحابية، الذكاء الاصطناعي، وتجارب الويب الآمنة والقابلة للتوسع.</p><a class="text-link" href="https://me.developers.google.com/u/EslamElshikh" target="_blank" rel="noopener">التحقق من الملف المهني</a></article>
            <article class="credential-card reveal"><span class="credential-number">472</span><h3>مساهمة في توثيق ملفات Google</h3><p>خبرة تراكمية في مراجعة أهلية الأنشطة، البيانات، وإشارات الثقة المطلوبة لملفات الأعمال.</p><a class="text-link" href="/google-expert/">تفاصيل خبرة Google</a></article>
            <article class="credential-card reveal"><span class="credential-number">233</span><h3>مشكلة ملف تجاري تمت معالجتها</h3><p>تشخيص مشكلات التعليق والتحقق والملكية والظهور، مع التركيز على الالتزام بالإرشادات بدل الحلول المؤقتة.</p><a class="text-link" href="/projects/#google-maps-work">مشاهدة نماذج الأعمال</a></article>
          </div>
          <div class="credentials-proof reveal"><span>مصادر هوية إضافية</span><a href="https://www.wikidata.org/wiki/Q138800449" target="_blank" rel="noopener">Wikidata Q138800449</a><a href="https://github.com/EslamElshikh-dev" target="_blank" rel="noopener">GitHub</a><a href="/about/">الملف المهني الكامل</a></div>
        </div>
      </section>
'''

          case_studies = '''
<section class="section-pad case-studies-section" id="case-studies"><div class="container"><div class="section-head reveal"><span class="eyebrow"><span></span>دراسات حالة</span><h2>المشكلة والحل والنتيجة في كل مشروع</h2><p>تفاصيل عملية توضح القرارات التي بُنيت عليها المشروعات، دون ادعاء أرقام أو نتائج غير موثقة.</p></div><div class="case-studies-grid">
<article class="case-study-card reveal"><div class="case-study-head"><span>01</span><div><p>مقاولات وخدمات محلية</p><h3>شركة تعاود للمقاولات</h3></div></div><dl><div><dt>التحدي</dt><dd>تنظيم خدمات مقاولات متعددة داخل تجربة عربية واضحة تدعم القرار والبحث المحلي.</dd></div><div><dt>الحل</dt><dd>بناء هيكل صفحات خدمات ومقالات وأسئلة شائعة، مع تجربة متجاوبة وبيانات منظمة وربط داخلي.</dd></div><div><dt>المخرجات</dt><dd>موقع قابل للتوسع، بنية محتوى محلية، نقاط تواصل مباشرة، وأساس تقني للسيو والتحسين المستمر.</dd></div></dl><div class="tag-row"><span>Web Development</span><span>Technical SEO</span><span>Content Architecture</span></div><a class="button button-ghost button-small" href="https://github.com/EslamElshikh-dev/tawod" target="_blank" rel="noopener">معاينة المشروع</a></article>
<article class="case-study-card reveal"><div class="case-study-head"><span>02</span><div><p>نجارة وديكور خشبي</p><h3>مؤسسة العنود للديكور الخشبي</h3></div></div><dl><div><dt>التحدي</dt><dd>عرض عدد كبير من خدمات التفصيل والصيانة بطريقة متناسقة على الجوال ومفهومة لمحركات البحث.</dd></div><div><dt>الحل</dt><dd>هيكلة الخدمات والصفحات المحلية، تحسين التسلسل البصري، وإضافة Schema وروابط داخلية ومحتوى موجه للرياض.</dd></div><div><dt>المخرجات</dt><dd>واجهة متجاوبة، مسارات خدمة واضحة، صفحات قابلة للفهرسة، وربط مباشر بين المحتوى والتواصل.</dd></div></dl><div class="tag-row"><span>Local SEO</span><span>Responsive UI</span><span>Schema</span></div><a class="button button-ghost button-small" href="https://github.com/EslamElshikh-dev/alanood-contracting" target="_blank" rel="noopener">معاينة المشروع</a></article>
<article class="case-study-card reveal"><div class="case-study-head"><span>03</span><div><p>خدمات منزلية بالرياض</p><h3>أمين لخدمات الصيانة</h3></div></div><dl><div><dt>التحدي</dt><dd>تحويل زيارات الجوال إلى اتصال أو WhatsApp بسرعة مع الحفاظ على وضوح الخدمات والمناطق المستهدفة.</dd></div><div><dt>الحل</dt><dd>صفحة هبوط خفيفة، أزرار تواصل ثابتة، محتوى خدمات وأحياء، وأسئلة شائعة موجهة لنوايا البحث المحلية.</dd></div><div><dt>المخرجات</dt><dd>رحلة استخدام مختصرة، وصول مباشر للتواصل، وبنية مناسبة للحملات والإعلانات والبحث المحلي.</dd></div></dl><div class="tag-row"><span>Landing Page</span><span>Conversion UX</span><span>Local Search</span></div><a class="button button-ghost button-small" href="https://ameenservse.vercel.app/" target="_blank" rel="noopener">زيارة الموقع</a></article>
</div></div></section>
'''

          html = index.read_text(encoding='utf-8')
          if 'id="credentials"' not in html:
              marker = '<section class="section-pad projects-section">'
              html = html.replace(marker, credentials + marker, 1)
              index.write_text(html, encoding='utf-8')

          html = projects.read_text(encoding='utf-8')
          if 'id="case-studies"' not in html:
              marker = '<section class="section-pad maps-portfolio-section"'
              html = html.replace(marker, case_studies + marker, 1)
              projects.write_text(html, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          if '/* Credentials and case studies */' not in css:
              css += r'''

/* Credentials and case studies */
.credentials-section { position: relative; background: linear-gradient(to bottom, transparent, rgba(14,32,48,.72), transparent); overflow: hidden; }
.credentials-section::before { content: ""; position: absolute; width: 520px; height: 520px; inset-inline-end: -280px; top: 8%; border-radius: 50%; background: radial-gradient(circle, rgba(83,216,255,.1), transparent 68%); pointer-events: none; }
.credentials-grid { position: relative; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 18px; }
.credential-card { min-width: 0; padding: 26px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(10,23,36,.82); box-shadow: var(--shadow-soft); }
.credential-card h3 { margin: 12px 0 10px; font-size: 1.06rem; }
.credential-card p { margin: 0 0 20px; color: var(--muted); font-size: .78rem; line-height: 1.85; }
.credential-kicker, .credential-number { display: inline-flex; min-height: 34px; align-items: center; padding: 7px 10px; border: 1px solid rgba(83,216,255,.22); border-radius: 9px; color: var(--cyan); background: rgba(83,216,255,.07); font-size: .68rem; font-weight: 850; }
.credential-number { font-size: 1.05rem; }
.credentials-proof { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-top: 22px; color: var(--muted-2); font-size: .7rem; }
.credentials-proof a { padding: 8px 11px; border: 1px solid var(--line); border-radius: 100px; color: var(--text); background: rgba(255,255,255,.025); }
.case-studies-section { background: linear-gradient(to bottom, rgba(12,28,42,.42), transparent); }
.case-studies-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 20px; }
.case-study-card { display: flex; min-width: 0; flex-direction: column; padding: 27px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(10,23,36,.86); box-shadow: var(--shadow-soft); }
.case-study-head { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 13px; align-items: start; }
.case-study-head > span { display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid rgba(83,216,255,.2); border-radius: 13px; color: var(--cyan); background: rgba(83,216,255,.06); font-size: .72rem; font-weight: 900; }
.case-study-head p { margin: 1px 0 5px; color: var(--mint); font-size: .65rem; font-weight: 850; }
.case-study-head h3 { margin: 0; font-size: 1.15rem; line-height: 1.55; }
.case-study-card dl { display: grid; gap: 14px; margin: 23px 0; }
.case-study-card dl > div { padding: 14px 15px; border-inline-start: 2px solid rgba(83,216,255,.28); background: rgba(255,255,255,.022); }
.case-study-card dt { margin-bottom: 5px; color: var(--cyan); font-size: .66rem; font-weight: 900; }
.case-study-card dd { margin: 0; color: var(--muted); font-size: .75rem; line-height: 1.8; }
.case-study-card .tag-row { margin-bottom: 22px; }
.case-study-card .button { margin-top: auto; align-self: flex-start; }
:root[data-theme="light"] .credential-card, :root[data-theme="light"] .case-study-card { background: rgba(255,255,255,.82); }
@media (max-width:1080px) { .credentials-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } .case-studies-grid { grid-template-columns: 1fr; } }
@media (max-width:620px) { .credentials-grid { grid-template-columns: 1fr; } .credential-card, .case-study-card { padding: 22px; } .credentials-proof { justify-content: flex-start; } }
'''
              css_path.write_text(css, encoding='utf-8')

          js = js_path.read_text(encoding='utf-8')
          js = js.replace(
              'filterButtons.forEach((button) => button.setAttribute("aria-selected", String(button.dataset.serviceFilter === group)));',
              'filterButtons.forEach((button) => { const active = button.dataset.serviceFilter === group; button.setAttribute("aria-selected", String(active)); button.setAttribute("tabindex", active ? "0" : "-1"); });'
          )
          if 'Unified conversion tracking' not in js:
              tracking = r'''

  // Unified conversion tracking. Works with dataLayer/GTM when present and remains harmless without analytics.
  const trackConversion = (eventName, details = {}) => {
    const payload = { event: eventName, page_path: window.location.pathname, ...details };
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push(payload);
    window.dispatchEvent(new CustomEvent("eslam:conversion", { detail: payload }));
  };

  document.addEventListener("click", (event) => {
    const link = event.target.closest("a[href]");
    if (!link) return;
    const href = link.getAttribute("href") || "";
    let eventName = "link_click";
    if (href.startsWith("tel:")) eventName = "phone_click";
    else if (href.includes("wa.me/")) eventName = "whatsapp_click";
    else if (href.startsWith("mailto:")) eventName = "email_click";
    else if (href.includes("maps.app.goo.gl") || href.includes("google.com/maps")) eventName = "google_maps_click";
    else if (link.closest(".project-card, .case-study-card, .maps-project-card")) eventName = "portfolio_click";
    else if (href.startsWith("/services/")) eventName = "service_click";
    trackConversion(eventName, { link_url: link.href, link_text: (link.textContent || "").trim().slice(0, 100) });
  });

  const servicesList = document.querySelector("[data-services-grid]");
  if (servicesList) servicesList.id = servicesList.id || "services-list";
  filterButtons.forEach((button, index) => {
    button.setAttribute("aria-controls", "services-list");
    button.addEventListener("keydown", (event) => {
      if (!["ArrowRight", "ArrowLeft", "Home", "End"].includes(event.key)) return;
      event.preventDefault();
      const direction = document.documentElement.dir === "rtl" ? -1 : 1;
      let target = index;
      if (event.key === "Home") target = 0;
      else if (event.key === "End") target = filterButtons.length - 1;
      else if (event.key === "ArrowRight") target = (index + direction + filterButtons.length) % filterButtons.length;
      else target = (index - direction + filterButtons.length) % filterButtons.length;
      filterButtons[target].focus();
      filterButtons[target].click();
    });
  });
'''
              js = js.replace('\n  const serviceNames = {', tracking + '\n  const serviceNames = {', 1)
              js = js.replace(
                  'const opened = window.open(url, "_blank", "noopener,noreferrer");',
                  'trackConversion("contact_form_submit", { requested_service: serviceNames[service] || service });\n      const opened = window.open(url, "_blank", "noopener,noreferrer");'
              )
              js_path.write_text(js, encoding='utf-8')
          PY
          python /tmp/phase1.py
          git add index.html projects/index.html assets/css/main.css assets/js/main.js
          git diff --check
          git commit -m "Add verified credentials, case studies and conversion tracking"
          git push origin HEAD:main

      - name: Phase 2 - page sharing, internal links, legal and security pages
        shell: bash
        run: |
          python -m pip install --quiet pillow arabic-reshaper python-bidi
          cat > /tmp/phase2.py <<'PY'
          from pathlib import Path
          import re, json, textwrap, os
          from PIL import Image, ImageDraw, ImageFont
          import arabic_reshaper
          from bidi.algorithm import get_display

          root = Path('.')
          site = 'https://eslam-elshikh.com'
          today = '2026-07-25'
          csp = "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; form-action 'self' https://wa.me; upgrade-insecure-requests"

          def slug_for(path):
              rel = path.relative_to(root).as_posix()
              if rel == 'index.html': return 'home'
              return rel.removesuffix('/index.html').removesuffix('.html').replace('/', '-') or 'home'

          def title_of(text):
              m = re.search(r'<title>(.*?)</title>', text, re.S)
              return re.sub(r'\s+', ' ', m.group(1)).strip() if m else 'المهندس إسلام الشيخ'

          def rtl_text(text):
              if re.search(r'[\u0600-\u06ff]', text):
                  return get_display(arabic_reshaper.reshape(text))
              return text

          def wrap(draw, text, font, max_width):
              words = text.split()
              lines, line = [], ''
              for word in words:
                  test = (line + ' ' + word).strip()
                  if draw.textbbox((0,0), rtl_text(test), font=font)[2] <= max_width:
                      line = test
                  else:
                      if line: lines.append(line)
                      line = word
              if line: lines.append(line)
              return lines[:3]

          og_dir = root / 'assets/og'
          og_dir.mkdir(parents=True, exist_ok=True)
          bold_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold = ImageFont.truetype(bold_path, 54)
          small = ImageFont.truetype(regular_path, 24)
          brand = ImageFont.truetype(bold_path, 31)

          html_files = [p for p in root.rglob('*.html') if '.git' not in p.parts]
          for path in html_files:
              html = path.read_text(encoding='utf-8')
              title = title_of(html)
              slug = slug_for(path)
              filename = f'{slug}.png'
              image = Image.new('RGB', (1200,630), '#07111b')
              px = image.load()
              for y in range(630):
                  for x in range(1200):
                      glow = max(0, 1 - ((x-930)**2 + (y-100)**2)**0.5/680)
                      px[x,y] = (7 + int(10*glow), 17 + int(35*glow), 27 + int(48*glow))
              draw = ImageDraw.Draw(image)
              draw.rounded_rectangle((70,65,1130,565), radius=34, outline='#23445a', width=2, fill='#0a1724')
              draw.rounded_rectangle((88,88,184,184), radius=25, fill='#123247', outline='#53d8ff', width=2)
              draw.text((113,110), 'ES', font=brand, fill='#eafaff')
              draw.text((215,106), 'Eslam Elshikh', font=brand, fill='#eafaff')
              draw.text((215,151), 'Cybersecurity · Software · Google · AI', font=small, fill='#7fc9dd')
              lines = wrap(draw, title, bold, 920)
              y = 268
              for line in lines:
                  shaped = rtl_text(line)
                  box = draw.textbbox((0,0), shaped, font=bold)
                  draw.text((1080-(box[2]-box[0]), y), shaped, font=bold, fill='#ffffff')
                  y += 76
              draw.text((92,510), 'eslam-elshikh.com', font=small, fill='#91a9b8')
              image.save(og_dir / filename, optimize=True, quality=92)

              og_url = f'{site}/assets/og/{filename}'
              html = re.sub(r'(<meta property="og:image" content=")[^"]+("\s*/?>)', rf'\g<1>{og_url}\2', html, count=1)
              html = re.sub(r'(<meta name="twitter:image" content=")[^"]+("\s*/?>)', rf'\g<1>{og_url}\2', html, count=1)
              if 'http-equiv="Content-Security-Policy"' not in html:
                  html = html.replace('<meta name="referrer" content="strict-origin-when-cross-origin">', '<meta name="referrer" content="strict-origin-when-cross-origin">\n  <meta http-equiv="Content-Security-Policy" content="' + csp.replace('&','&amp;').replace('"','&quot;') + '">', 1)
              html = re.sub(r'<img(?![^>]*\bdecoding=)', '<img decoding="async"', html)
              path.write_text(html, encoding='utf-8')

          related_map = {
              'cybersecurity': [('بناء موقع سريع وآمن','/blog/secure-website-development/'),('تطوير المواقع والتطبيقات','/services/web-development/'),('الحلول السحابية الآمنة','/services/cloud-solutions/')],
              'cloud-solutions': [('الأمن السيبراني','/services/cybersecurity/'),('قواعد المعرفة','/services/knowledge-bases/'),('وكلاء الذكاء الاصطناعي','/services/ai-agents/')],
              'ai-agents': [('دليل بدء مشروع وكيل AI','/blog/ai-agent-business/'),('قواعد المعرفة','/services/knowledge-bases/'),('تطوير البرمجيات','/services/web-development/')],
              'web-development': [('دليل بناء موقع آمن','/blog/secure-website-development/'),('الأمن السيبراني','/services/cybersecurity/'),('تحسين محركات البحث','/services/seo/')],
              'google-support': [('خبرة Google','/google-expert/'),('إدارة الملفات التجارية','/services/google-business-profile/'),('أعمال خرائط Google','/projects/#google-maps-work')],
              'google-business-profile': [('تشخيص تعليق ملف Google','/blog/google-business-profile-suspension/'),('أعمال خرائط Google','/projects/#google-maps-work'),('السيو المحلي','/services/seo/')],
              'knowledge-bases': [('وكلاء الذكاء الاصطناعي','/services/ai-agents/'),('الحلول السحابية','/services/cloud-solutions/'),('تطوير البرمجيات','/services/web-development/')],
              'seo': [('تطوير المواقع','/services/web-development/'),('إدارة ملفات Google','/services/google-business-profile/'),('إدارة الإعلانات','/services/digital-advertising/')],
              'digital-advertising': [('تحسين محركات البحث','/services/seo/'),('تطوير صفحات الهبوط','/services/web-development/'),('تواصل لمناقشة الحملة','/contact/')],
          }
          for slug, links in related_map.items():
              path = root / f'services/{slug}/index.html'
              if not path.exists(): continue
              html = path.read_text(encoding='utf-8')
              if 'related-content-section' in html: continue
              items = ''.join(f'<a href="{href}"><strong>{name}</strong><span>عرض التفاصيل</span></a>' for name,href in links)
              section = f'<section class="section-pad related-content-section"><div class="container"><div class="section-head reveal"><span class="eyebrow"><span></span>محتوى مرتبط</span><h2>خطوات تكمل هذه الخدمة</h2></div><div class="related-links reveal">{items}</div></div></section>'
              html = html.replace('</main>', section + '</main>', 1)
              path.write_text(html, encoding='utf-8')

          article_map = {
              'ai-agent-business': [('وكلاء الذكاء الاصطناعي','/services/ai-agents/'),('قواعد المعرفة','/services/knowledge-bases/'),('ابدأ مشروعك','/contact/?service=ai-agents')],
              'google-business-profile-suspension': [('إدارة ملفات Google','/services/google-business-profile/'),('خبرة Google','/google-expert/'),('نماذج الأعمال','/projects/#google-maps-work')],
              'secure-website-development': [('تطوير المواقع','/services/web-development/'),('الأمن السيبراني','/services/cybersecurity/'),('تحسين محركات البحث','/services/seo/')],
          }
          for slug, links in article_map.items():
              path = root / f'blog/{slug}/index.html'
              if not path.exists(): continue
              html = path.read_text(encoding='utf-8')
              if 'related-content-section' in html: continue
