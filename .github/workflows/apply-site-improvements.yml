وط الاستخدام</a><a href="/.well-known/security.txt">الإبلاغ الأمني</a></div></div></footer><script src="/assets/js/main.js" defer></script></body></html>'''

          privacy_body = '''<h2>البيانات التي قد تجمع</h2><p>لا يطلب الموقع إنشاء حساب. عند التواصل قد تقدم اسمك وبيانات نشاطك وتفاصيل المشروع طوعًا عبر WhatsApp أو البريد الإلكتروني.</p><h2>القياس والتحليلات</h2><p>يسجل الموقع أحداثًا عامة مثل الضغط على الاتصال أو WhatsApp داخل طبقة بيانات فنية، ويمكن ربطها مستقبلًا بأداة تحليلات. لا تُرسل تفاصيل نموذج التواصل إلى خادم الموقع.</p><h2>الخدمات الخارجية</h2><p>قد تفتح روابط إلى Google وخرائط Google وGitHub وWhatsApp ومنصات اجتماعية، وتخضع الزيارة لسياسات تلك الخدمات.</p><h2>التواصل</h2><p>للاستفسارات المتعلقة بالخصوصية استخدم البريد <a href="mailto:info@eslam-elshikh.com">info@eslam-elshikh.com</a>.</p>'''
          terms_body = '''<h2>طبيعة المحتوى</h2><p>المعلومات المنشورة تعريفية وتعليمية ولا تمثل ضمانًا لنتيجة تجارية أو تقنية محددة قبل الاتفاق على نطاق العمل.</p><h2>الاستشارات والأعمال</h2><p>تُحدد المخرجات والمدة والتكلفة والمسؤوليات في عرض أو اتفاق مستقل لكل مشروع. أعمال الأمن السيبراني تُنفذ فقط ضمن صلاحية مكتوبة ونطاق مصرح.</p><h2>الملكية الفكرية</h2><p>هوية الموقع ومحتواه الأصلي محفوظان. تبقى العلامات والأسماء والروابط الخارجية مملوكة لأصحابها.</p><h2>الروابط الخارجية</h2><p>تُوفر روابط المشروعات والخرائط والمنصات الرسمية للتوثيق وسهولة الوصول، ولا يتحكم الموقع في محتوى تلك الخدمات أو توفرها.</p>'''
          p = root/'privacy'; p.mkdir(exist_ok=True); (p/'index.html').write_text(simple_page('سياسة الخصوصية | المهندس إسلام الشيخ','توضح هذه الصفحة كيفية التعامل مع بيانات التواصل والقياس والروابط الخارجية داخل موقع المهندس إسلام الشيخ.',site+'/privacy/',privacy_body),encoding='utf-8')
