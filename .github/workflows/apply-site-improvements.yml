.footer-legal a:hover { color: var(--cyan); }
@media (max-width:820px) { .related-links { grid-template-columns: 1fr; } }
@media (max-width:620px) { .footer-legal { justify-content: center; } }
'''
              css_path.write_text(css,encoding='utf-8')
          PY
