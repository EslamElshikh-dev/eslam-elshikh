name: Site quality checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.xml"
      - "**/*.json"
      - "assets/**"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f sitemap.xml
          test -f robots.txt
          test -f 404.html
          test -f .well-known/security.txt
          test -f privacy/index.html
          test -f terms/index.html
          grep -q "https://www.eslam-elshikh.com/" sitemap.xml
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,204,206,429 --exclude-mail "./**/*.html" "./**/*.xml" "./**/*.json"
          fail: true
