steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - ops/seo-control-center/Dockerfile
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, ${_IMAGE}]

images:
  - ${_IMAGE}

substitutions:
  _IMAGE: gcr.io/$PROJECT_ID/seo-control-center:latest
